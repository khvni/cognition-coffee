name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build
        env:
          GATSBY_POSTHOG_KEY: phc_p7D6e5BTGZL456Qt5jMMwL5d7ZQiS6MhnaXeFZGc6eZa
          GATSBY_POSTHOG_HOST: https://us.i.posthog.com
        run: npm run build
      - name: Slop gate (deslop -b main)
        run: |
          git fetch origin main:main || true
          npm run slop
